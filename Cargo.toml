[package]
name = "couchpad"
version = "1.0.0"
edition = "2024"
description = "A minimal CLI tool that maps gamepad/controller inputs to keyboard events"

[dependencies]
gilrs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ctrlc = "3.5.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-graphics-types = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }
